# buf configuration used by hack/verify/proto-breaking.sh to detect
# wire/JSON-breaking changes to the ateapi surface. WIRE_JSON (rather than
# FILE) is the right strictness while external SDKs generate their own stubs
# from a vendored copy of this proto: wire compatibility is the contract.
version: v2
breaking:
  use:
    - WIRE_JSON
